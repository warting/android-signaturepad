name: Ink device verification

on:
  pull_request:

jobs:
  ink-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Ink and screenshot tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./scripts/test-ink-device.sh
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ink device reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ink-screenshots/
          retention-days: 7
