name: Pull request workflow

on:
  pull_request:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          lfs: true

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Generate cache key
        run: ./scripts/checksum.sh ./ checksum.txt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/build-cache-*
            build-cache
          key: gradle-${{ hashFiles('checksum.txt') }}

      - name: Run Android checks
        run: ./gradlew check apiCheck :app:assembleDebug :sample-android:assembleDebug :app:testDebugScreenshotTestDefaultTestSuite --stacktrace

      - name: Validate publication task graph
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --dry-run -PVERSION_NAME=2.0.0-SNAPSHOT -PmavenCentralUsername=ci-validation -PmavenCentralPassword=not-a-secret

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Reports
          path: |
            **/build/reports/*
            signature-compose/build/screenshots/
            app/build/intermediates/debug/testDebugScreenshotTestDefaultTestSuite/results/
          retention-days: 2
